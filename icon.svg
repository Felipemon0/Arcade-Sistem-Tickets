<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#0051A8"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F2F7"/>
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  
  <!-- Ticket Body with Notches -->
  <g transform="translate(96, 120)">
    <!-- Base Ticket -->
    <path d="M 0 32 C 0 14.3 14.3 0 32 0 L 288 0 C 305.7 0 320 14.3 320 32 L 320 100 C 302 100 288 114 288 136 C 288 158 302 172 320 172 L 320 240 C 320 257.7 305.7 272 288 272 L 32 272 C 14.3 272 0 257.7 0 240 L 0 172 C 18 172 32 158 32 136 C 32 114 18 100 0 100 Z" fill="url(#ticket)"/>
    
    <!-- Perforated Divider Line -->
    <line x1="88" y1="20" x2="88" y2="252" stroke="#D2D2D7" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
    
    <!-- Star / Arcade Symbol -->
    <path d="M 204 88 L 212 112 L 238 112 L 217 127 L 225 151 L 204 136 L 183 151 L 191 127 L 170 112 L 196 112 Z" fill="#0071E3"/>
    
    <!-- Ticket Details / Barcode simulation -->
    <rect x="130" y="174" width="148" height="8" rx="4" fill="#86868B" opacity="0.6"/>
    <rect x="146" y="194" width="116" height="6" rx="3" fill="#AEAEB2" opacity="0.6"/>
    <rect x="160" y="210" width="88" height="6" rx="3" fill="#D2D2D7" opacity="0.6"/>
    
    <!-- Stub Number -->
    <text x="44" y="142" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#86868B" text-anchor="middle" transform="rotate(-90 44 142)">ADMIT</text>
  </g>
</svg>
